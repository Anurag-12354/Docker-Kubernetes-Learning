spring:
  application:
    name: stockflow
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/stockflow}
    username: ${DATABASE_USERNAME:stockflow}
    password: ${DATABASE_PASSWORD:stockflow}
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  port: ${PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
app:
  version: ${APP_VERSION:1.0.0}
  instance: ${HOSTNAME:local}
