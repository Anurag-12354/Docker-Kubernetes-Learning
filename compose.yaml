services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow-local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "stockflow",
          "-d",
          "stockflow",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: stockflow:v2
    ports:
      - "127.0.0.1:18081:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/stockflow
      DATABASE_USERNAME: stockflow
      DATABASE_PASSWORD: stockflow-local
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    external: true
    name: stockflow-pgdata
